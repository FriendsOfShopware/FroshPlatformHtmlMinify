<html>
<head>
    <title>line comments</title>
</head>
<body>
<script id="singleComment">
    // a single line comment
    window.a = 1;
</script>

<script id="twoComments">
    // two adjacent line comments
    // the second one used to survive and comment out everything after it
    window.b = 2;
</script>

<script id="threeComments">
    // three
    // adjacent
    // line comments
    window.c = 3;
</script>
</body>
</html>
